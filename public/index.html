<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node.js AI Chatbot</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🤖</div>
          <span>Node AI Chatbot</span>
        </div>
      </div>

      <button class="btn-new-chat" id="new-chat-btn">
        <span>+ Percakapan Baru</span>
      </button>

      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Cari riwayat percakapan..." />
      </div>

      <div class="conversation-list" id="conversation-list">
        <!-- Rendered dynamically -->
      </div>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn-copy">🌓 Ganti Tema</button>
        <span id="status-badge" class="status-badge">Memuat status...</span>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">
      <header class="chat-header">
        <div class="header-title-container">
          <h1 id="current-chat-title" style="font-size: 1.1rem; font-weight: 600;">Percakapan Baru</h1>
        </div>
        <div>
          <span style="font-size: 0.8rem; color: var(--text-secondary);">Powered by Node.js & SQLite</span>
        </div>
      </header>

      <div class="chat-messages" id="chat-messages">
        <!-- Messages rendered dynamically -->
      </div>

      <div class="chat-input-area">
        <div class="input-container">
          <textarea id="chat-input" class="chat-textarea" placeholder="Ketik pesan Anda di sini... (Enter untuk kirim, Shift+Enter untuk baris baru)" rows="1"></textarea>
          <button id="send-btn" class="btn-send" title="Kirim Pesan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">Node.js AI Chatbot v1.0 • Didukung oleh SQLite & Google Gemini</div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
